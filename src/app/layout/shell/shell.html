<nav class="topbar">
  <div class="topbar-inner">
    <div class="brandBlock">
      <div class="brand">Resources Management</div>

      <div class="menuTabs">
        <!-- admin sees catalogue -->
        <a *ngIf="auth.isAdmin()" class="menuTab" routerLink="/catalogue" routerLinkActive="active">
          Catalogue
        </a>

        <!-- everyone sees bookings -->
        <a class="menuTab" routerLink="/bookings" routerLinkActive="active">
          Bookings
        </a>
      </div>
    </div>

    <!-- ✅ Role toggle (always visible) -->
    <div class="roleSwitch" role="group" aria-label="Role">
      <input
        type="radio"
        class="btn-check"
        name="appRole"
        id="roleUserTop"
        [checked]="auth.role() === 'user'"
        (change)="setRole('user')"
      />
      <label class="roleBtn" for="roleUserTop">User</label>

      <input
        type="radio"
        class="btn-check"
        name="appRole"
        id="roleAdminTop"
        [checked]="auth.role() === 'admin'"
        (change)="setRole('admin')"
      />
      <label class="roleBtn" for="roleAdminTop">Admin</label>
    </div>
  </div>
</nav>

<div class="container-fluid py-3">
  <router-outlet></router-outlet>
</div>
